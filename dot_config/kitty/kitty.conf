# On macOS kitty skips fonts CoreText doesn't flag as monospace; only the "Mono" Nerd Font variant is.
font_family JetBrainsMono Nerd Font Mono
font_size 16

include catppuccin-mocha.conf

# Shell integration is sourced from ~/.bashrc.
shell_integration no-rc

window_padding_width 8
background_opacity 0.92
background_blur 20
scrollback_lines 10000
confirm_os_window_close 0
enable_audio_bell no
cursor_trail 0
cursor_blink_interval 0
# Option is the window-manager key (AeroSpace); don't let kitty eat it.
macos_option_as_alt no
macos_quit_when_last_window_closed yes
