# Plugins are cloned by chezmoi (.chezmoiexternal.toml).
run-shell ~/.config/tmux/plugins/sensible/sensible.tmux

# tmux-256color gives nvim italics/undercurl; RGB passes truecolor through to kitty.
set  -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set  -g status-keys vi
set  -g mode-keys   vi
set  -g mouse        on
set  -g focus-events on
setw -g clock-mode-style 24
set  -s escape-time   10
set  -g history-limit 10000

set -g @catppuccin_flavor 'mocha'
run-shell ~/.config/tmux/plugins/catppuccin/catppuccin.tmux
