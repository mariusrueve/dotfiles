after-login-command = []
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]
start-at-login = true

[gaps.inner]
horizontal = 8
vertical = 8

[gaps.outer]
bottom = 8
left = 8
right = 8
top = 8

[mode.main.binding]
alt-0 = "workspace 10"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-b = "exec-and-forget open -a 'Google Chrome'"
alt-cmd-0 = "move-node-to-workspace 10"
alt-cmd-1 = "move-node-to-workspace 1"
alt-cmd-2 = "move-node-to-workspace 2"
alt-cmd-3 = "move-node-to-workspace 3"
alt-cmd-4 = "move-node-to-workspace 4"
alt-cmd-5 = "move-node-to-workspace 5"
alt-cmd-6 = "move-node-to-workspace 6"
alt-cmd-7 = "move-node-to-workspace 7"
alt-cmd-8 = "move-node-to-workspace 8"
alt-cmd-9 = "move-node-to-workspace 9"
alt-comma = "layout accordion horizontal vertical"
alt-ctrl-h = "resize width -50"
alt-ctrl-j = "resize height +50"
alt-ctrl-k = "resize height -50"
alt-ctrl-l = "resize width +50"
alt-down = "focus down"
alt-e = "exec-and-forget open ~"
alt-enter = "exec-and-forget open -n /Applications/kitty.app"
alt-esc = "exec-and-forget pmset displaysleepnow"
alt-f = "fullscreen"
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"
alt-left = "focus left"
alt-m = "macos-native-fullscreen"
alt-o = "layout tiles horizontal vertical"
alt-period = "exec-and-forget open raycast://extensions/raycast/emoji-symbols/search-emoji-symbols"
alt-q = "close"
alt-right = "focus right"
alt-s = "workspace S"
alt-shift-0 = ["move-node-to-workspace 10", "workspace 10"]
alt-shift-1 = ["move-node-to-workspace 1", "workspace 1"]
alt-shift-2 = ["move-node-to-workspace 2", "workspace 2"]
alt-shift-3 = ["move-node-to-workspace 3", "workspace 3"]
alt-shift-4 = ["move-node-to-workspace 4", "workspace 4"]
alt-shift-5 = ["move-node-to-workspace 5", "workspace 5"]
alt-shift-6 = ["move-node-to-workspace 6", "workspace 6"]
alt-shift-7 = ["move-node-to-workspace 7", "workspace 7"]
alt-shift-8 = ["move-node-to-workspace 8", "workspace 8"]
alt-shift-9 = ["move-node-to-workspace 9", "workspace 9"]
alt-shift-down = "move down"
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"
alt-shift-left = "move left"
alt-shift-right = "move right"
alt-shift-s = "move-node-to-workspace S"
alt-shift-semicolon = "mode service"
alt-shift-up = "move up"
alt-t = "layout floating tiling"
alt-tab = "workspace-back-and-forth"
alt-up = "focus up"
alt-v = "exec-and-forget open raycast://extensions/raycast/clipboard-history/clipboard-history"

[mode.service.binding]
backspace = ["close-all-windows-but-current", "mode main"]
esc = ["reload-config", "mode main"]
f = ["layout floating tiling", "mode main"]
r = ["flatten-workspace-tree", "mode main"]

[[on-window-detected]]
run = "layout floating"

[on-window-detected.if]
app-id = "com.apple.systempreferences"

[[on-window-detected]]
run = "layout floating"

[on-window-detected.if]
app-id = "com.apple.calculator"

[[on-window-detected]]
run = "layout floating"

[on-window-detected.if]
app-id = "com.apple.ActivityMonitor"

[workspace-to-monitor-force-assignment]
10 = "built-in"
